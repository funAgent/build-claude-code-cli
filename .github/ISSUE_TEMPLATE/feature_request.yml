name: 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你希望添加或改进的内容。

  - type: dropdown
    id: area
    attributes:
      label: 建议所在区域
      options:
        - 课程内容（新增课程 / 改进现有课程）
        - 教学网站功能
        - 开发者体验（工具 / 脚本 / 文档）
        - 其他
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 清晰地描述你期望的功能
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 使用场景
      description: 为什么需要这个功能？它解决什么问题？

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你是否考虑过其他替代方案？
